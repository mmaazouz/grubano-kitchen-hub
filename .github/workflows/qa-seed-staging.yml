name: QA — Seed staging operator (manual)

# Manually seeds the STAGING database with ONE test operator + fixture data so the
# operator visual-QA robot (scripts/qa/operator-visual-qa.mjs) can log in and capture
# the auth-gated screens. Uses the existing `DATABASE_URL_STAGING` CI secret — the URL
# is NEVER exposed to a human. STAGING ONLY; the seed's own prod-guard also refuses prod.
#
# ⚠️ GitHub rule: a workflow_dispatch job is only triggerable once this file is on the
# DEFAULT branch (main). It reaches main with the normal develop→main promotion. It never
# runs on a push (no push trigger), so committing it is inert until dispatched.
#
# How to run: Actions → "QA — Seed staging operator (manual)" → Run workflow → pick the
# branch, type the QA password → read QA_RESTAURANT_ID / QA_BRAND_ID / QA_SUPPLIER_ID from
# the job log (also written to the run Summary).

on:
  workflow_dispatch:
    inputs:
      qa_email:
        description: 'QA operator email (MUST be test-ish: contains +qa, or ends .test / .qa)'
        required: true
        default: 'qa+op@grubano.test'
      qa_password:
        description: 'QA operator password (used later by the robot login)'
        required: true

concurrency:
  group: qa-seed-staging
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Prisma generate (client)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: npx prisma@5.22.0 generate
      - name: Seed staging QA operator (prod-guarded)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          QA_EMAIL: ${{ inputs.qa_email }}
          QA_PASSWORD: ${{ inputs.qa_password }}
          QA_SEED_CONFIRM: STAGING_ONLY
        run: |
          node scripts/qa/seed-qa-operator.mjs --confirm-staging | tee seed.out
          echo "### QA seed — ids for the robot" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'QA_(EMAIL|RESTAURANT_ID|BRAND_ID|SUPPLIER_ID)' seed.out >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
