name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://app.grubano.com
          NEXT_TELEMETRY_DISABLED: 1

      - name: Patch server.js for Linux
        run: node scripts/fix-server.js

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy-temp/.next

          # Copy entire standalone output — INCLUDING its own trimmed node_modules.
          # .next/standalone/node_modules is built by Next.js standalone mode and
          # contains next, react, and all runtime packages the server needs.
          # Do NOT delete it — the server cannot start without it.
          cp -r .next/standalone/. deploy-temp/

          # Verify node_modules/next is present (sanity check)
          if [ ! -d deploy-temp/node_modules/next ]; then
            echo "ERROR: node_modules/next missing from standalone output!"
            echo "Check that next.config.js has: output: 'standalone'"
            exit 1
          fi
          echo "OK: node_modules/next present in standalone"

          # Static assets (CSS/JS bundles — not inside standalone by default)
          cp -r .next/static deploy-temp/.next/static

          # Prisma schema for db push
          cp -r prisma deploy-temp/prisma

          # Public assets
          [ -d public ] && cp -r public deploy-temp/public || true

          # .htaccess — Passenger config for staging
          printf 'PassengerEnabled on\nPassengerAppRoot /home/deyi0010/app.grubano.com\nPassengerAppType node\nPassengerStartupFile server.js\nPassengerNodejs /home/deyi0010/nodevenv/grubano.com/24/bin/node\nPassengerMaxPoolSize 1\nPassengerStartTimeout 120\n' > deploy-temp/.htaccess

          # .env.local — ALL required runtime variables
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}"
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
            echo "NEXTAUTH_URL=https://app.grubano.com"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            echo "SMTP_USER=${{ secrets.SMTP_USER }}"
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
            echo "CRON_SECRET=${{ secrets.CRON_SECRET }}"
            echo "NODE_ENV=production"
          } > deploy-temp/.env.local

          echo "deploy-temp size: $(du -sh deploy-temp | cut -f1)"
          echo "Files to upload: $(find deploy-temp -type f | wc -l)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASS }}
          local-dir: ./deploy-temp/
          server-dir: /app.grubano.com/
          exclude: |
            **/.git*
            **/.git*/**

      # ── SSH: chmod + Passenger restart ────────────────────────────────────────
      # node_modules is bundled in the standalone output — no npm ci needed.
      - name: Fix permissions and restart
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            chmod -R 755 ~/app.grubano.com/.next/    2>/dev/null || true
            chmod 600    ~/app.grubano.com/.env.local 2>/dev/null || true
            chmod 644    ~/app.grubano.com/server.js  2>/dev/null || true
            mkdir -p ~/app.grubano.com/tmp
            touch ~/app.grubano.com/tmp/restart.txt
            echo "✅ Staging restarted"

      - name: Health check
        run: |
          sleep 25
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://app.grubano.com/eat || echo "000")
          echo "app.grubano.com/eat → HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Staging is live!"
          else
            echo "⚠️  Health check returned $STATUS (non-blocking)"
          fi
