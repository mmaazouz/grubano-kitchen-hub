name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip post-deploy health check'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://grubano.com
          NEXT_TELEMETRY_DISABLED: 1

      - name: Patch server.js for Linux
        run: node scripts/fix-server.js

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy-temp/.next

          # Copy standalone output
          cp -r .next/standalone/. deploy-temp/

          # ── CRITICAL: remove node_modules from deploy-temp ──────────────────
          # CloudLinux on o2switch blocks FTP writes to node_modules silently.
          # node_modules will be installed on the server via "npm ci --omit=dev"
          # in the SSH step below (SSH runs as the hosting user who has write access).
          rm -rf deploy-temp/node_modules

          # Static assets (CSS/JS bundles — not in standalone by default)
          cp -r .next/static deploy-temp/.next/static

          # Passenger wrapper (overwrites Next.js-generated server.js)
          cp server.js deploy-temp/server.js

          # package.json + lock needed for npm ci on the server
          cp package.json      deploy-temp/package.json
          cp package-lock.json deploy-temp/package-lock.json

          # Prisma schema for db push
          cp -r prisma deploy-temp/prisma

          # Public assets
          [ -d public ] && cp -r public deploy-temp/public || true

          # .htaccess — Passenger config for production
          printf 'PassengerEnabled on\nPassengerAppRoot /home/deyi0010/grubano.com\nPassengerAppType node\nPassengerStartupFile server.js\nPassengerNodejs /home/deyi0010/nodevenv/grubano.com/24/bin/node\nPassengerMaxPoolSize 2\nPassengerMaxRequests 1000\nPassengerStartTimeout 120\n' > deploy-temp/.htaccess

          # .env.local — ALL required runtime variables
          # NEXTAUTH_SECRET + NEXTAUTH_URL are critical — missing = 500 on every request
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}"
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
            echo "NEXTAUTH_URL=https://grubano.com"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            echo "SMTP_USER=${{ secrets.SMTP_USER }}"
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
            echo "CRON_SECRET=${{ secrets.CRON_SECRET }}"
            echo "NODE_ENV=production"
          } > deploy-temp/.env.local

          # Sanity check: ensure no node_modules snuck in
          if [ -d deploy-temp/node_modules ]; then
            echo "ERROR: node_modules found in deploy-temp — CloudLinux will block this!"
            exit 1
          fi

          echo "deploy-temp size (no node_modules): $(du -sh deploy-temp | cut -f1)"
          echo "Files to upload: $(find deploy-temp -type f | wc -l)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASS }}
          local-dir: ./deploy-temp/
          server-dir: /grubano.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ── SSH step 1: install dependencies ──────────────────────────────────────
      # SSH (hosting user) CAN write to node_modules; FTP (ftpd process) cannot.
      - name: Install dependencies on server
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            # Activate Node 24 virtualenv
            source ~/nodevenv/grubano.com/24/bin/activate

            cd ~/grubano.com
            echo "Node: $(node --version) | npm: $(npm --version)"

            # Install production deps (bcryptjs, next-auth, prisma client, etc.)
            npm ci --omit=dev --prefer-offline 2>&1 | tail -5
            echo "✅ npm ci complete ($(ls node_modules | wc -l) packages)"

      # ── SSH step 2: chmod + Passenger restart ─────────────────────────────────
      - name: Fix permissions and restart
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            chmod -R 755 ~/grubano.com/.next/    2>/dev/null || true
            chmod 600    ~/grubano.com/.env.local 2>/dev/null || true
            chmod 644    ~/grubano.com/server.js  2>/dev/null || true
            mkdir -p ~/grubano.com/tmp
            touch ~/grubano.com/tmp/restart.txt
            echo "✅ Production restarted"

      - name: Health check
        if: ${{ !inputs.skip_health_check }}
        run: |
          sleep 25
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://grubano.com/eat || echo "000")
          echo "grubano.com/eat → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (HTTP $STATUS) — check Passenger logs"
            exit 1
          fi
          echo "✅ Production is live!"
