name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip post-deploy health check'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Opt JS actions into Node 24 now (checkout/setup-node/FTP-Deploy-Action still
# ship Node 20, deprecated on the runner from 2026-06-02). Silences the warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://grubano.com
          NEXT_TELEMETRY_DISABLED: 1

      - name: Patch server.js for Linux
        run: node scripts/fix-server.js

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy-temp/.next

          # Copy entire standalone output — INCLUDING its own trimmed node_modules.
          # .next/standalone/node_modules is built by Next.js standalone mode and
          # contains next, react, and all runtime packages the server needs.
          # Do NOT delete it — the server cannot start without it.
          cp -r .next/standalone/. deploy-temp/

          # Verify node_modules/next is present (sanity check)
          if [ ! -d deploy-temp/node_modules/next ]; then
            echo "ERROR: node_modules/next missing from standalone output!"
            echo "Check that next.config.js has: output: 'standalone'"
            exit 1
          fi
          echo "OK: node_modules/next present in standalone"

          # Static assets (CSS/JS bundles — not inside standalone by default)
          cp -r .next/static deploy-temp/.next/static

          # Prisma schema (only schema.prisma needed on server)
          mkdir -p deploy-temp/prisma
          cp prisma/schema.prisma deploy-temp/prisma/schema.prisma

          # Public assets
          [ -d public ] && cp -r public deploy-temp/public || true

          # .htaccess — Passenger config for production (printf avoids BOM)
          printf 'PassengerEnabled on\nPassengerAppRoot /home/deyi0010/grubano.com\nPassengerAppType node\nPassengerStartupFile server.js\nPassengerNodejs /home/deyi0010/nodevenv/grubano.com/24/bin/node\nPassengerMaxPoolSize 2\nPassengerMaxRequests 1000\nPassengerStartTimeout 120\n' > deploy-temp/.htaccess

          # .env.local from secret (full file content, avoids per-secret sprawl)
          printf '%s' "${{ secrets.ENV_LOCAL_CONTENT }}" > deploy-temp/.env.local

          echo "deploy-temp size: $(du -sh deploy-temp | cut -f1)"
          echo "Files to upload: $(find deploy-temp -type f | wc -l)"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # O2SWITCH_HOST secret now holds the o2switch FTP hostname
          # (ftp.deyi0010.odns.fr). The SSH step below uses the IP directly,
          # because FTP and SSH use different endpoints on o2switch.
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASS }}
          # o2switch Pure-FTPd enforces explicit FTPS (FTP over TLS) on port 21.
          # Plain `ftp` (the action default) hangs and times out — this is why
          # no deploy had ever succeeded. ftps = explicit AUTH TLS.
          protocol: ftps
          port: 21
          # Raise from the 30s default: TLS handshake + the many small files in
          # the standalone node_modules push past 30s on shared hosting.
          timeout: 120000
          # Verbose so the exact FTP error is visible in the run log next time
          # (job logs are admin-gated via the API).
          log-level: verbose
          local-dir: ./deploy-temp/
          server-dir: /grubano.com/
          exclude: |
            **/.git*
            **/.git*/**

      # ── SSH: chmod + Passenger restart ────────────────────────────────────────
      # node_modules is bundled in the standalone output — no npm ci needed.
      - name: Fix permissions and restart
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          # SSH uses the IP directly — O2SWITCH_HOST now holds the FTP hostname,
          # which is not the SSH endpoint. Restart is non-critical (continue-on-error).
          host: 109.234.165.222
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            chmod -R 755 ~/grubano.com/.next/    2>/dev/null || true
            chmod 600    ~/grubano.com/.env.local 2>/dev/null || true
            chmod 644    ~/grubano.com/server.js  2>/dev/null || true
            mkdir -p ~/grubano.com/tmp
            touch ~/grubano.com/tmp/restart.txt
            echo "✅ Production restarted"

      - name: Health check
        if: ${{ !inputs.skip_health_check }}
        run: |
          sleep 25
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://www.grubano.com/dashboard || echo "000")
          echo "www.grubano.com/dashboard → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERR Health check failed (HTTP $STATUS) — check Passenger logs"
            exit 1
          fi
          echo "OK Production is live!"
