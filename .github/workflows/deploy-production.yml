name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip post-deploy health check'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Opt JS actions into Node 24 now (checkout/setup-node/FTP-Deploy-Action still
# ship Node 20, deprecated on the runner from 2026-06-02). Silences the warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Finance gate (A6 gardiens) ────────────────────────────────────────────
  # Same pure unit tests run on staging — block the production FTP push if
  # the lib/commission / lib/invoice / ledger-equation properties regress.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Widened from test:finance after the full-suite audit (referral mock
      # repaired, middleware green): every tests/ file now gates the deploy.
      - name: Unit tests (full suite)
        run: npm run test:ci
      # B4 (Sprint 0 Lot B) — compile gate BLOQUANT : next build casse parfois
      # quand les tests passent (ex. useSearchParams sans <Suspense>). Le job
      # deploy échouerait de toute façon à son propre build — ici on échoue
      # AVANT le FTP, plus vite et plus lisiblement (aucun risque nouveau).
      # Secrets REPO-LEVEL (staging) exprès : ce job n'a pas l'environment
      # `production`, ses secrets scoppés seraient irrésolus — pure gate de
      # compilation, le deploy rebuilde ensuite avec l'env prod.
      # T-123 — ARBITRAGE FONDATEUR (2026-09-28) : le gel des rails money-OUT est un GATE DE BUILD.
      # « Je préfère un build qui échoue si l'un de ces rails money-OUT est accidentellement ouvert
      #   plutôt qu'une simple surveillance qui laisse compiler. »
      # Il n'était invoqué que dans tests.yml, un workflow SÉPARÉ qui ne bloque pas ce déploiement :
      # la règle n'avait donc aucune dent sur le chemin qui livre. Placé AVANT le build, il échoue
      # vite et lisiblement. Portée honnête : il juge l'environnement du RUNNER — le `.env.local` du
      # serveur n'est jamais écrit par la CI, et c'est phase2-preflight.js (T-119) qui l'asserte.
      - name: Money-OUT rails frozen (T-123, build gate)
        run: npm run check:flags
      - name: Generate Prisma client (compile gate)
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      - name: Build (compile gate)
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://grubano.com
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # i18n completeness gate — fails the deploy if any locale is missing or
      # has empty keys vs messages/fr.json, so untranslated strings never ship.
      - name: Check translations
        run: node scripts/check-translations.js

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://grubano.com
          NEXT_TELEMETRY_DISABLED: 1

      - name: Patch server.js for Linux
        run: node scripts/fix-server.js

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy-temp/.next

          # Copy entire standalone output — INCLUDING its own trimmed node_modules.
          # .next/standalone/node_modules is built by Next.js standalone mode and
          # contains next, react, and all runtime packages the server needs.
          # Do NOT delete it — the server cannot start without it.
          cp -r .next/standalone/. deploy-temp/

          # Verify node_modules/next is present (sanity check)
          if [ ! -d deploy-temp/node_modules/next ]; then
            echo "ERROR: node_modules/next missing from standalone output!"
            echo "Check that next.config.js has: output: 'standalone'"
            exit 1
          fi
          echo "OK: node_modules/next present in standalone"

          # Static assets (CSS/JS bundles — not inside standalone by default)
          cp -r .next/static deploy-temp/.next/static

          # Prisma schema (only schema.prisma needed on server)
          mkdir -p deploy-temp/prisma
          cp prisma/schema.prisma deploy-temp/prisma/schema.prisma

          # PROD-2 — the two SHARED cores the server operators `require()` at runtime.
          # deploy-staging.yml ships them; production did not, so phase2-preflight.js and
          # phase2-claims-pay-window.js would throw MODULE_NOT_FOUND on the production host.
          # They are plain .js, read-only, and contain no secret.
          mkdir -p deploy-temp/lib
          cp lib/ledger-check-core.js   deploy-temp/lib/ledger-check-core.js
          cp lib/claims-payable-core.js deploy-temp/lib/claims-payable-core.js

          # Server-run OPS scripts (JS only). scripts/server/ is the DESIGNATED
          # server bucket: prune-next.js (post-deploy static prune) + admin/ops
          # scripts like legacy-password-reset-notify.js (C-1). The WHOLE bucket
          # ships (*.js) so a new server ops script deploys automatically. The .sh
          # deploy scripts and the local dev tooling at scripts/ root (notion-sync,
          # seed-demo-data, backfill-*) deliberately do NOT ship to the public server.
          mkdir -p deploy-temp/scripts/server
          cp scripts/server/*.js deploy-temp/scripts/server/

          # Cron probes (rail A6 gardiens — ledger check + monthly invoices,
          # called by cPanel cron). ONLY scripts/cron/ ships — never the whole
          # scripts/ folder (local tooling like notion-sync must NOT reach a
          # public server).
          mkdir -p deploy-temp/scripts/cron
          cp scripts/cron/*.js deploy-temp/scripts/cron/

          # Public assets
          [ -d public ] && cp -r public deploy-temp/public || true

          # PROD-2 — .htaccess is DELIBERATELY NOT WRITTEN any more, and is excluded below.
          # It used to be generated here by printf. Two measured reasons, either of which alone
          # is disqualifying:
          #   (a) the server's .htaccess is NOT FTP-writable — Pure-FTPd answers 553 Permission
          #       denied on STOR, and a failed STOR ABORTS THE WHOLE SYNC, skipping the
          #       post-deploy SSH, the restart and every health check. deploy-staging.yml hit
          #       exactly this and fixed it in f5177914.
          #   (b) if it DID write, it would replace the live Apache/Passenger configuration with
          #       a 7-directive printf — destroying the apex→www redirect and any dotfile
          #       protection the host has in place. That is the worse outcome of the two.
          # Passenger is already configured on the production host: grubano.com currently serves
          # Phusion Passenger's own "Web application could not be started" page, which only
          # appears when Passenger IS running and reading an .htaccess. There is nothing to ship.
          # If the production .htaccess ever needs changing, that is a deliberate cPanel edit.

          # .env.local is INTENTIONALLY NOT written into deploy-temp/. The
          # ENV_LOCAL_CONTENT secret was unset, so this line was creating an
          # empty file that the FTP sync would push and overwrite the real
          # server .env.local — the runtime source of truth. The server's
          # .env.local is now authoritative; the FTP step also excludes
          # .env* below as a second safety net so a deploy-temp/.env.local
          # accidentally introduced upstream still can't reach the server.

          echo "deploy-temp size: $(du -sh deploy-temp | cut -f1)"
          echo "Files to upload: $(find deploy-temp -type f | wc -l)"

      # S0-3 — build traceability: VERSION at the deploy root + public/version.json
      # served statically at https://www.grubano.com/version.json. Static
      # artifacts only — the app never reads them; zero runtime change.
      - name: Stamp build info (VERSION + version.json)
        run: node scripts/build-info.js deploy-temp

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # O2SWITCH_HOST secret now holds the o2switch FTP hostname
          # (ftp.deyi0010.odns.fr). The SSH step below uses the IP directly,
          # because FTP and SSH use different endpoints on o2switch.
          server: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_FTP_USER }}
          password: ${{ secrets.O2SWITCH_FTP_PASS }}
          # o2switch Pure-FTPd enforces explicit FTPS (FTP over TLS) on port 21.
          # Plain `ftp` (the action default) hangs and times out — this is why
          # no deploy had ever succeeded. ftps = explicit AUTH TLS.
          protocol: ftps
          port: 21
          # Raise from the 30s default: TLS handshake + the many small files in
          # the standalone node_modules push past 30s on shared hosting.
          timeout: 120000
          # Verbose so the exact FTP error is visible in the run log next time
          # (job logs are admin-gated via the API).
          log-level: verbose
          local-dir: ./deploy-temp/
          server-dir: /grubano.com/
          exclude: |
            # PROD-2 — ~/grubano.com/node_modules on the server is a SYMLINK to the nodevenv's
            # lib/node_modules. Pure-FTPd cannot CWD into it, so ANY write under node_modules/
            # returns 550 "Can't change directory to node_modules" and ABORTS THE WHOLE SYNC —
            # post-deploy, restart and health check all skipped. Measured on staging and fixed
            # there in 07627b98; production never received it. The app runs on the nodevenv's
            # modules, so node_modules must not be transferred at all.
            # CONSEQUENCE, stated: the production nodevenv must have had `npm install` run once.
            node_modules
            node_modules/**
            **/.git*
            **/.git*/**
            # Server-regenerated artifacts: the Post-deploy SSH step runs
            # `npx prisma@5.22.0 generate` which rebuilds .prisma/client/*
            # with the o2switch nodevenv binaryTarget. Including it in the
            # FTP transfer is both redundant and triggers reproducible
            # 553 "Can't open that file: No such file or directory" errors
            # on Pure-FTPd when dir state diverges between deploys, which
            # aborts the whole job (Post-deploy + restart + health check
            # all skipped). Exclude entirely; the server regenerates it.
            node_modules/.prisma
            node_modules/.prisma/**
            # Local CLI binaries / symlinks — not used at runtime by the
            # standalone server, and FTP-syncing symlinks is fragile.
            node_modules/.bin
            node_modules/.bin/**
            # Never overwrite the server's .env.local — it is the runtime
            # source of truth (DB URL, NEXTAUTH_SECRET, etc.). The workflow
            # no longer writes one into deploy-temp/, and this exclude is a
            # belt-and-suspenders guard: even if a future change accidentally
            # re-introduces a deploy-temp/.env.local (empty or stale), the
            # FTP sync will skip every .env* file.
            .env.local
            .env*
            # PROD-2 — @vercel/og + its WASM: thousands of nested binary STORs that Pure-FTPd
            # drowns in. Subsumed by the node_modules exclusion above; kept explicit because it
            # is the failure that took staging's deploys down after next/og arrived.
            node_modules/next/dist/compiled/@vercel/og
            node_modules/next/dist/compiled/@vercel/og/**
            # PROD-2 — the server's .htaccess is not FTP-writable (553) and must not be
            # overwritten; the workflow no longer writes one. Second safety net.
            .htaccess

      # ── SSH: post-deploy server tasks ─────────────────────────────────────────
      # Runs AFTER the FTP upload completes. Each line is best-effort (|| true)
      # so a single failure (e.g. prisma generate hiccup) does not skip the
      # Passenger restart at the end — that restart is the LAST line on
      # purpose, so it always fires while the SSH session is still open.
      #
      # Order matters:
      #   1. prisma generate  — rebuild client for the server's binaryTarget
      #   2. prune-next       — delete stale .next/static artifacts owned by
      #                          previous builds. This is the FIX for the
      #                          recurring "blank page / CSS 404" right after
      #                          a deploy: SamKirkland/FTP-Deploy-Action never
      #                          removes remote files, so without this the
      #                          new HTML keeps 404-ing on chunks the next
      #                          process state still expects.
      #   3. touch restart.txt — Passenger picks up fresh code + clean static
      #
      # NOTE (P0 security): the former "seed test user" step is gone FOR GOOD —
      # it upserted a demo account whose credentials are versioned in this
      # PUBLIC repo, re-arming them on every deploy. Never reintroduce an
      # automatic account seed here; account provisioning goes through the
      # gated MANUAL seeds only.
      - name: Post-deploy server tasks
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: 109.234.165.222
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            source ~/nodevenv/grubano.com/24/bin/activate
            cd ~/grubano.com
            npx prisma@5.22.0 generate || true
            node scripts/server/prune-next.js || true
            mkdir -p tmp
            touch tmp/restart.txt

      # ── SSH: chmod + Passenger restart ────────────────────────────────────────
      # node_modules is bundled in the standalone output — no npm ci needed.
      - name: Fix permissions and restart
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          # SSH uses the IP directly — O2SWITCH_HOST now holds the FTP hostname,
          # which is not the SSH endpoint. Restart is non-critical (continue-on-error).
          host: 109.234.165.222
          username: ${{ secrets.O2SWITCH_USER }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          port: 22
          script: |
            chmod -R 755 ~/grubano.com/.next/    2>/dev/null || true
            chmod 600    ~/grubano.com/.env.local 2>/dev/null || true
            chmod 644    ~/grubano.com/server.js  2>/dev/null || true
            mkdir -p ~/grubano.com/tmp
            touch ~/grubano.com/tmp/restart.txt
            echo "✅ Production restarted"

      # ── PROD-2 — RESTART INDEPENDENT OF SSH ───────────────────────────────────
      # Both SSH steps above are `continue-on-error`, and o2switch has timed out SSH from
      # GitHub runners 3 times out of 3 (docs/ops/BETA-PRODUCT-FINAL-CLOSEOUT.md §BLOQUANTS
      # INFRA, "dial tcp …:22 i/o timeout"). When that happens the files land and the OLD
      # process keeps serving — a deploy that is green and inert. This FTPS upload touches
      # tmp/restart.txt over the one channel that is proven to work from a runner.
      # It was staging-only pending proof; the stated bar was "two consecutive deploys with
      # exit 0". MEASURED: runs 36433674654, 36459283998 and 36463525963 — three consecutive
      # staging deploys with this step at `success`. The bar is met.
      # `continue-on-error`: it can only ADD a restart attempt, never remove one.
      - name: Trigger Passenger restart via FTPS (independent of SSH)
        if: ${{ success() }}
        continue-on-error: true
        run: |
          STAMP="restart from run ${{ github.run_id }} at $(date -u +%FT%TZ) sha ${{ github.sha }}"
          MARKER=$(mktemp)
          ERRLOG=$(mktemp)
          printf '%s\n' "$STAMP" > "$MARKER"
          echo "-- FTPS restart trigger --"
          echo "host:   muscadier.o2switch.net (cert SAN match - strict TLS verify)"
          echo "target: ~/grubano.com/tmp/restart.txt"
          echo "marker: $STAMP"
          if curl --fail --silent --show-error \
                  --ssl-reqd \
                  --ftp-create-dirs \
                  --connect-timeout 30 \
                  --max-time 60 \
                  --upload-file "$MARKER" \
                  --user "${{ secrets.O2SWITCH_FTP_USER }}:${{ secrets.O2SWITCH_FTP_PASS }}" \
                  "ftp://muscadier.o2switch.net/grubano.com/tmp/restart.txt" \
                  2> "$ERRLOG"; then
            RC=0
            echo "OK FTPS upload returned exit 0 - Passenger should reload within seconds."
          else
            RC=$?
            echo "ERR FTPS upload returned exit $RC"
            echo "curl stderr:"
            sed 's/^/  /' "$ERRLOG"
            echo ""
            echo 'The two SSH "touch tmp/restart.txt" steps above may still have triggered it.'
            echo 'If production still serves stale code, run in cPanel Terminal:'
            echo '    touch ~/grubano.com/tmp/restart.txt'
          fi
          rm -f "$MARKER" "$ERRLOG"
          exit $RC

      # S0-3 — verify the deployed build matches this run's commit. Non-blocking
      # (the blocking gate stays the Health check below). Manual check any time:
      #   curl -s https://www.grubano.com/version.json
      - name: Verify deployed build (version.json)
        continue-on-error: true
        run: |
          sleep 20
          DEPLOYED=$(curl -sL --max-time 30 https://www.grubano.com/version.json || echo '{}')
          echo "deployed version.json: $DEPLOYED"
          if printf '%s' "$DEPLOYED" | grep -q "${{ github.sha }}"; then
            echo "OK deployed production build matches commit ${{ github.sha }}"
          else
            echo "WARN production does not (yet) serve ${{ github.sha }} — Passenger may still be restarting; re-check manually."
          fi

      # ── PROD-2 — HEALTH CHECK, ANCHORED ON THIS RUN'S SHA (BLOCKING) ──────────
      # REPLACES: `curl -sL www.grubano.com/dashboard == 200`. That check could not fail for
      # the reason it existed. `/dashboard` is auth-gated, middleware redirects to the login
      # page, `-L` follows it, and 200 comes back — from ANY build, including a process that
      # never restarted. It would have reported green through the 2026-09-06 incident (a
      # served HTML whose client bundles all 404, i.e. inert auth forms and zero client JS).
      # This version requires /version.json to serve THIS run's commit, with retries for the
      # Passenger swap window.
      - name: Health check (production @ expected SHA)
        if: ${{ !inputs.skip_health_check }}
        run: |
          EXPECTED="${{ github.sha }}"
          URL="https://grubano.com/version.json"
          ATTEMPTS=8
          DELAY=15
          BODY_FILE="$(mktemp)"
          CODE="000"
          SERVED=""
          echo "expected sha : $EXPECTED"
          echo "target       : $URL"
          sleep 15
          i=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            : > "$BODY_FILE"
            CODE=$(curl -sS -L --max-time 30 -o "$BODY_FILE" -w '%{http_code}' "$URL") || CODE="000"
            SERVED=$(sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([0-9a-fA-F]\{7,40\}\)".*/\1/p' "$BODY_FILE" | head -n 1)
            echo "attempt $i/$ATTEMPTS - HTTP $CODE - served commit: ${SERVED:-<none>}"
            if [ "$CODE" = "200" ] && [ "$SERVED" = "$EXPECTED" ]; then
              echo "OK production healthy at expected SHA ($EXPECTED)"
              rm -f "$BODY_FILE"
              exit 0
            fi
            i=$((i + 1))
            if [ "$i" -le "$ATTEMPTS" ]; then sleep "$DELAY"; fi
          done
          echo "ERR production health check FAILED after $ATTEMPTS attempts"
          echo "  url             : $URL"
          echo "  last HTTP status: $CODE"
          echo "  expected commit : $EXPECTED"
          echo "  served commit   : ${SERVED:-<none - version.json unreadable or absent>}"
          echo "  body (400 B max):"
          head -c 400 "$BODY_FILE" | sed 's/^/    /'
          echo ""
          echo "  First deploy? The production .env.local (DATABASE_URL + NEXTAUTH_SECRET) and a"
          echo "  populated nodevenv are prerequisites this pipeline deliberately cannot create."
          echo "  Otherwise: Passenger did not pick up the build. In cPanel Terminal:"
          echo "    touch ~/grubano.com/tmp/restart.txt"
          rm -f "$BODY_FILE"
          exit 1

      # ── PROD-2 — THE PRISMA CLIENT IS NOT STALE (BLOCKING) ────────────────────
      # version.json is a STATIC file: it proves the upload, never that the running process
      # can reach the database. The post-deploy `npx prisma generate` runs inside an SSH step
      # that is `continue-on-error` and has TIMED OUT 3/3 against this host, and staging has
      # already run "new schema + new code + STALE client" for exactly that reason
      # (docs/ops/BETA-PRODUCT-FINAL-CLOSEOUT.md §BLOQUANTS INFRA #1). A stale client against
      # a fresh schema is invisible to every 200-based check and surfaces as 500s on the first
      # real customer. /api/restaurants is public, read-only, and hits the database.
      - name: Database reachable through the deployed Prisma client (BLOCKING)
        if: ${{ !inputs.skip_health_check }}
        run: |
          URL="https://grubano.com/api/restaurants"
          ATTEMPTS=6
          DELAY=15
          i=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            CODE=$(curl -sS -L -o /dev/null --max-time 30 -w '%{http_code}' "$URL") || CODE="000"
            echo "attempt $i/$ATTEMPTS - $URL -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "OK the deployed Prisma client reaches the production database"
              exit 0
            fi
            i=$((i + 1))
            if [ "$i" -le "$ATTEMPTS" ]; then sleep "$DELAY"; fi
          done
          echo "ERR the database is NOT reachable through the deployed build (last HTTP $CODE)"
          echo "  Most likely, in order:"
          echo "    1. the production schema was never created (no prisma/migrations in this repo -"
          echo "       a virgin database needs ONE deliberate 'npx prisma@5.22.0 db push', no --accept-data-loss);"
          echo "    2. the Prisma client on the server is STALE - the SSH generate step timed out."
          echo "       In cPanel Terminal:  source ~/nodevenv/grubano.com/24/bin/activate"
          echo "                            cd ~/grubano.com && npx prisma@5.22.0 generate"
          echo "                            touch tmp/restart.txt"
          echo "    3. DATABASE_URL is missing or wrong in ~/grubano.com/.env.local."
          exit 1

      # ── PROD-2 — CLIENT BUNDLE INTEGRITY (BLOCKING) ───────────────────────────
      # The served HTML must only reference /_next/static assets the server can actually
      # serve. A mismatch = zero client JavaScript = permanent Suspense skeleton and inert
      # forms: the P0 of 2026-09-06, which every 200-based check passed straight through.
      - name: Client bundle integrity (served HTML -> every _next/static asset 200)
        if: ${{ !inputs.skip_health_check }}
        run: |
          BASE="https://grubano.com"
          PAGES="/fr/auth/magic /fr/eat/auth"
          ATTEMPTS=6
          DELAY=15
          i=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            FAIL=0
            CHECKED=0
            for P in $PAGES; do
              HTML=$(curl -sS -L --max-time 30 "$BASE$P") || HTML=""
              ASSETS=$(printf '%s' "$HTML" | grep -o '/_next/static/[^" <>\\]*\.\(js\|css\)' | sort -u)
              if [ -z "$ASSETS" ]; then
                echo "ERR $P references no /_next/static asset (empty or non-HTML response)"
                FAIL=1
                continue
              fi
              if ! printf '%s\n' "$ASSETS" | grep -q 'chunks/webpack-'; then
                echo "ERR $P does not reference a webpack runtime chunk"
                FAIL=1
              fi
              for A in $ASSETS; do
                CODE=$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "$BASE$A") || CODE="000"
                CHECKED=$((CHECKED + 1))
                if [ "$CODE" != "200" ]; then
                  echo "ERR $A -> HTTP $CODE (referenced by $P)"
                  FAIL=1
                fi
              done
            done
            if [ "$FAIL" = "0" ]; then
              echo "OK client bundle integrity - $CHECKED referenced assets served 200 for: $PAGES"
              exit 0
            fi
            echo "attempt $i/$ATTEMPTS failed - Passenger may still be swapping; retry in ${DELAY}s"
            i=$((i + 1))
            if [ "$i" -le "$ATTEMPTS" ]; then sleep "$DELAY"; fi
          done
          echo "ERR CLIENT BUNDLE INTEGRITY FAILED - the served HTML references assets the server cannot serve."
          echo "  The running process and the files on disk belong to different builds."
          echo "  Fix: cPanel Terminal ->  touch ~/grubano.com/tmp/restart.txt  then re-run this job."
          exit 1

      # ── Trigger docs rebuild ──────────────────────────────────────────────────
      # Fires a repository_dispatch at grubano-docs after a successful prod deploy
      # so the auto-update workflow there regenerates the API reference + changelog.
      # Staging deploys deliberately do NOT do this (avoids Claude API spend on
      # every dev push). Requires repo secret DOCS_DISPATCH_TOKEN — a fine-grained
      # PAT scoped to mmaazouz/grubano-docs with Contents: write (or Actions: write).
      # The default GITHUB_TOKEN cannot dispatch cross-repo.
      - name: Trigger docs rebuild
        if: success()
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOCS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mmaazouz/grubano-docs/dispatches \
            -d '{"event_type":"app-updated"}'
