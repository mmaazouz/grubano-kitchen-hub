<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grubano — Mot de passe</title>
<link href="fonts/eat-fonts.css" rel="stylesheet">
<style>
:root{
  --gb-zest:#FF6A1F; --gb-zest-600:#F2570E; --gb-ink:#0F2742;
  --gb-bg:#FBF8F3; --gb-surface:#FFFFFF; --gb-surface-2:#FBF8F3;
  --gb-border:#ECE5D8; --gb-border-strong:#E2D9CC;
  --gb-text:#0F2742; --gb-muted:#6B7682; --gb-muted-2:#9C7B5C;
  --gb-basil-600:#1E9E57; --gb-basil-bg:#EAF7EF; --gb-danger:#E0402E;
  --gb-grad:linear-gradient(135deg,#FF8A3D,#F2570E);
  --gb-font-display:'Gabarito',system-ui,sans-serif; --gb-font-ui:'Hanken Grotesk',system-ui,sans-serif;
  --gb-r-md:12px; --gb-r-lg:16px; --gb-r-pill:999px;
  --gb-shadow-card:0 1px 2px rgba(15,39,66,.04),0 14px 30px -20px rgba(15,39,66,.16);
  --gb-shadow-btn:0 10px 22px -10px rgba(242,87,14,.6);
  --gb-focus:0 0 0 3px rgba(255,106,31,.16); --gb-focus-border:#FF6A1F;
}
[data-theme="dark"]{
  --gb-bg:#0C1826; --gb-surface:#14253A; --gb-surface-2:#0C1826;
  --gb-border:#233247; --gb-border-strong:#233247;
  --gb-text:#EEF3F9; --gb-muted:#93A3B5; --gb-muted-2:#7E8FA3;
  --gb-basil-600:#41BD78; --gb-basil-bg:rgba(65,189,120,.14); --gb-danger:#FF6B5C;
  --gb-zest:#FF7C39; --gb-focus:0 0 0 3px rgba(255,124,57,.18); --gb-focus-border:#FF7C39;
}
*{box-sizing:border-box}
body{margin:0;background:var(--gb-bg);color:var(--gb-text);font-family:var(--gb-font-ui);-webkit-font-smoothing:antialiased}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;-webkit-font-feature-settings:'liga'}
input,button{font-family:inherit}
.screen{min-height:100vh;display:flex;flex-direction:column;color:var(--gb-text)}
.bar{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0}
.bar .ms{font-size:23px;cursor:pointer} .bar h2{flex:1;margin:0;font-family:var(--gb-font-display);font-weight:700;font-size:18px}
.body{flex:1;overflow-y:auto;padding:0 18px;max-width:560px;width:100%;margin:0 auto}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gb-muted-2);margin:18px 0 9px}
.field{margin-bottom:12px} .field>span{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
.ctrl{display:flex;align-items:center;gap:10px;background:var(--gb-surface);border:1px solid var(--gb-border-strong);border-radius:var(--gb-r-md);padding:12px 13px}
.ctrl .ms{font-size:18px;color:var(--gb-muted-2)} .ctrl input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--gb-text);width:100%}
.ctrl:focus-within{border-color:var(--gb-focus-border);box-shadow:var(--gb-focus)}
.ctrl .ms[style]{cursor:pointer}
.hlp{font-size:11px;color:var(--gb-muted);margin:6px 2px 0}
.linkrow{display:flex;align-items:center;gap:12px;background:var(--gb-surface);border:1px solid var(--gb-border);border-radius:var(--gb-r-md);padding:13px;cursor:pointer}
.linkrow .ic{width:36px;height:36px;border-radius:10px;background:var(--gb-surface-2);border:1px solid var(--gb-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.linkrow .ic .ms{font-size:19px;color:var(--gb-zest-600)} [data-theme="dark"] .linkrow .ic .ms{color:var(--gb-zest)}
.linkrow .m{flex:1} .linkrow .m b{font-size:13.5px;font-weight:700;display:block} .linkrow .m span{font-size:11px;color:var(--gb-muted)}
.linkrow>.ms{font-size:19px;color:var(--gb-muted-2)}
.foot{flex-shrink:0;padding:12px 18px 16px;background:var(--gb-surface);border-top:1px solid var(--gb-border)} .foot .inner{max-width:560px;margin:0 auto}
.save{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gb-grad);border-radius:13px;padding:14px;box-shadow:var(--gb-shadow-btn);cursor:pointer} .save b{font-size:14px;font-weight:700;color:#fff}
</style>
</head>
<body>
<main class="screen">
  <div class="bar"><span class="ms">arrow_back</span><h2>Mot de passe</h2></div>
  <div class="body">
    <p class="lbl" style="margin-top:6px">Changer le mot de passe</p>

    <div class="field"><span>Mot de passe actuel</span>
      <div class="ctrl"><span class="ms">lock</span><input type="password" value="••••••••"><span class="ms" style="cursor:pointer">visibility_off</span></div>
    </div>

    <div class="field"><span>Nouveau mot de passe</span>
      <div class="ctrl"><span class="ms">lock_reset</span><input type="password" value="••••••••••"><span class="ms" style="cursor:pointer">visibility</span></div>
      <div style="display:flex;gap:5px;margin-top:9px">
        <span style="flex:1;height:5px;border-radius:3px;background:var(--gb-basil-600)"></span>
        <span style="flex:1;height:5px;border-radius:3px;background:var(--gb-basil-600)"></span>
        <span style="flex:1;height:5px;border-radius:3px;background:#EA9410"></span>
        <span style="flex:1;height:5px;border-radius:3px;background:var(--gb-border)"></span>
      </div>
      <p class="hlp">8+ caractères, dont un chiffre et un symbole.</p>
    </div>

    <div class="field"><span>Confirmer</span>
      <div class="ctrl"><span class="ms">lock_reset</span><input type="password" value="••••••••••"></div>
    </div>

    <div class="linkrow" style="margin-top:6px"><span class="ic"><span class="ms">help</span></span><div class="m"><b>Mot de passe oublié ?</b><span>Recevoir un lien de réinitialisation</span></div><span class="ms">chevron_right</span></div>
  </div>
  <div class="foot"><div class="inner"><div class="save"><span class="ms" style="font-size:18px;color:#fff">check</span><b>Mettre à jour</b></div></div></div>
</main>
</body>
</html>
